name: Deploy VPN & Bot to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Переходим в папку проекта на сервере
            cd /opt/my-vpn-project || exit
            
            # Подтягиваем последние изменения из GitHub
            git pull origin main
            
            # Пересобираем и перезапускаем контейнеры
            docker compose down
            docker compose up -d --build
            
            # Удаляем старые неиспользуемые Docker-образы для экономии места
            docker image prune -f
